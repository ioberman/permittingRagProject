# Optional Render Blueprint - lets you deploy via "New > Blueprint" instead of
# clicking through the dashboard by hand. See docs/DEPLOYMENT.md for the full
# walkthrough (including the manual-dashboard path, which is the one to use
# if you'd rather review each setting yourself before it's created).
#
# Render's blueprint spec evolves - if a field here is rejected, check
# Render's current docs for the equivalent option rather than guessing.

databases:
  - name: plan-review-copilot-db
    databaseName: plan_review_copilot
    user: plan_review_copilot
    plan: basic-256mb # pick whatever tier fits - see docs/DEPLOYMENT.md

services:
  - type: web
    name: plan-review-copilot
    runtime: python
    plan: starter # NOTE: this blueprint is inactive/archival - the app now runs on Oracle
    # (docs/HOSTING.md), not Render. At the time this was written, retrieval ran on fastembed
    # (ONNX Runtime) instead of sentence-transformers/torch specifically to fit a 512MB Render
    # instance (see docs/DEPLOYMENT.md); that swap has since been reverted back to
    # sentence-transformers. If you revive this Render path, re-apply the fastembed swap
    # yourself first - the current code does not fit a small Render instance as-is.
    buildCommand: pip install -r requirements.txt
    # --timeout 120: gunicorn's default (30s) killed a real request on Render's
    # free-tier CPU - the document network graph's first hit of fastembed
    # (model load + embedding) landed while AUTO_SEED_ON_START's background
    # thread was still churning through Chicago's 3800+ clauses, competing for
    # the same single core/GIL. The client saw a truncated response
    # ("Unexpected end of JSON input"), not a real error - the request was
    # still working, just killed mid-flight before it could finish.
    startCommand: gunicorn app.web:app --timeout 120
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: plan-review-copilot-db
          property: connectionString
      - key: STORAGE_ROOT
        value: /var/data/storage
      - key: ANTHROPIC_API_KEY
        sync: false # set the real value in the Render dashboard, not here
      - key: GROQ_API_KEY
        sync: false
    disk:
      name: plan-review-storage
      mountPath: /var/data
      sizeGB: 1
