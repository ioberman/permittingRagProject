  <!-- front sheet -->
  <rect x="19" y="11" width="27" height="35" rx="2" fill="#F5F1E8"/>
  <rect x="24" y="20" width="17" height="3" rx="1.5" fill="#14293D"/>
  <rect x="24" y="28" width="11" height="3" rx="1.5" fill="#E08A4B"/>
  <rect x="24" y="36" width="15" height="3" rx="1.5" fill="#14293D"/>

